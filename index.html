<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="양원준의 개인 홈페이지" />
    <title>양원준 | Personal Site</title>
    <style>
      :root { --ink: #172033; --muted: #5f6b7e; --line: #dce3ec; --paper: #fff; --mist: #f4f7fb; --blue: #2d5bba; --blue-pale: #e9f0ff; }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body { margin: 0; color: var(--ink); background: var(--mist); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", sans-serif; line-height: 1.65; }
      .site { width: min(100% - 2rem, 920px); margin: 0 auto; padding: 1rem 0 3rem; }
      header { display: flex; align-items: center; justify-content: space-between; padding: 1rem 0 2.5rem; font-size: .94rem; }
      .brand { font-weight: 750; letter-spacing: -.03em; }
      nav { display: flex; gap: 1.1rem; }
      nav a { color: var(--muted); text-decoration: none; }
      nav a:hover, nav a:focus-visible { color: var(--blue); }
      main { display: grid; gap: 1.25rem; }
      .hero, .card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; }
      .hero { padding: clamp(2rem, 7vw, 4.8rem); background: linear-gradient(135deg, #fff 0%, #f3f7ff 100%); }
      .eyebrow { margin: 0 0 1rem; color: var(--blue); font-size: .88rem; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
      h1, h2 { letter-spacing: -.045em; line-height: 1.2; }
      h1 { margin: 0; font-size: clamp(2.55rem, 9vw, 5.4rem); }
      .lead { max-width: 36rem; margin: 1.25rem 0 0; color: var(--muted); font-size: clamp(1rem, 2.5vw, 1.2rem); }
      .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.25rem; }
      .card { padding: clamp(1.5rem, 4vw, 2.2rem); }
      h2 { margin: 0 0 1rem; font-size: 1.45rem; }
      p { margin: 0; }
      .interests { display: flex; flex-wrap: wrap; gap: .65rem; }
      .tag { padding: .45rem .85rem; color: #21488f; background: var(--blue-pale); border-radius: 999px; font-weight: 650; }
      .contact { display: grid; gap: .25rem; }
      .contact a { width: fit-content; color: var(--blue); font-size: 1.08rem; font-weight: 700; overflow-wrap: anywhere; }
      footer { padding: 2rem 0 0; color: var(--muted); font-size: .85rem; }
      @media (max-width: 600px) { .site { width: min(100% - 1.25rem, 920px); padding-top: .25rem; } header { padding-bottom: 1.5rem; } nav { gap: .75rem; font-size: .86rem; } .grid { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div class="site">
      <header>
        <div class="brand">YANG WONJUN</div>
        <nav aria-label="페이지 탐색"><a href="#about">소개</a><a href="#interests">관심사</a><a href="#contact">연락처</a></nav>
      </header>
      <main>
        <section class="hero" aria-labelledby="welcome">
          <p class="eyebrow">Personal Website</p>
          <h1 id="welcome">양원준</h1>
          <p class="lead">서울대학교 첨단융합학부에서 배우고, 관심 있는 분야를 탐색하고 있습니다.</p>
        </section>
        <div class="grid">
          <section class="card" id="about" aria-labelledby="about-title"><h2 id="about-title">소개</h2><p>서울대학교 첨단융합학부에 재학 중입니다. 새로운 기술과 아이디어를 차분히 배우고 기록합니다.</p></section>
          <section class="card" id="interests" aria-labelledby="interests-title"><h2 id="interests-title">관심사</h2><div class="interests"><span class="tag">그래픽</span><span class="tag">투자</span></div></section>
        </div>
        <section class="card contact" id="contact" aria-labelledby="contact-title"><h2 id="contact-title">연락처</h2><a href="mailto:qthoodie@snu.ac.kr">qthoodie@snu.ac.kr</a></section>
      </main>
      <footer>© 2026 Yang Wonjun</footer>
    </div>
  </body>
</html>
